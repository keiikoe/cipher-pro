function playSound(type){

const ctx = new (window.AudioContext || window.webkitAudioContext)();

const osc = ctx.createOscillator();
const gain = ctx.createGain();

osc.connect(gain);
gain.connect(ctx.destination);

let freq = 440;
let duration = 0.18;

switch(type){

case "success":
freq = 700;
duration = 0.18;
break;

case "error":
freq = 220;
duration = 0.25;
break;

case "save":
freq = 540;
duration = 0.20;
break;

case "decrypt":
freq = 900;
duration = 0.28;
break;

case "delete":
freq = 280;
duration = 0.22;
break;
}

osc.frequency.setValueAtTime(freq, ctx.currentTime);
osc.type = "triangle";

gain.gain.setValueAtTime(0.12, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(
0.001,
ctx.currentTime + duration
);

osc.start(ctx.currentTime);
osc.stop(ctx.currentTime + duration);
}

function autoProcess(){

let input = ($("entrada").value || '').trim();

if(!input) return;

let isBinary = /^[01\s]+$/.test(input);

if(isBinary){
process('dec');
}else{
process('enc');
}
}

/*  ENCRYPT  */
function encrypt(){ process('enc'); }
function decrypt(){ process('dec'); }

function process(mode){
$("loader").style.display = 'block';

setTimeout(()=>{

let input = ($("entrada").value || '').toLowerCase();
let result = '';

/*  ENCRIPTAR  */
if(mode === 'enc'){

for(let i=0;i<input.length;i++){
let c = input[i];

if(c === ' '){
result += '  ';
continue;
}

if(map[c] !== undefined){
result += map[c];

if(input[i+1] && map[input[i+1]]){
result += ' ';
}

}else{

result += c;
}
}

/*  DESENCRIPTAR  */
}else{

let clean = input
.replace(/\s*,\s*/g, ' , ')
.replace(/\s*\?\s*/g, ' ? ')
.replace(/\s*!\s*/g, ' ! ')
.replace(/\s*\.\s*/g, ' . ')
.trim();

let words = clean.split('  ');
let out = '';

for(let w of words){
let tokens = w.split(' ');

for(let t of tokens){

if(!t) continue;

/* signos */
if([',','?','!','.'].includes(t)){
    out = out.trimEnd();   
    out += t + ' ';        
    continue;
}

/* binario */
out += inv[t] || t;
}

out += ' ';
}

result = out.trim();
}

type(result);
guardarHistorial(input,result,mode);

$("loader").style.display = 'none';

},600);
}

entrada: inText,
salida: outText,

});

localStorage.setItem('historialCipher', JSON.stringify(h));
}

let safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
return String(text).replace(new RegExp(safe,'gi'),
m => `<span class="neon">${m}</span>`);
}

<span style="color:#00ff88">OUT:</span> ${highlight(i.salida)}

</div>
`).join('') : `<div style="color:#00ff88">NO LOGS FOUND</div>`;
}

/* BACKGROUND  */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = "01";
const fontSize = 18;
const columns = canvas.width / fontSize;

const drops = [];

for(let i=0; i<columns; i++){
    drops[i]=1;
}

function drawMatrix(){

ctx.fillStyle = "rgba(0,0,0,0.08)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "#00ff88";
ctx.font = fontSize + "px monospace";

for(let i=0;i<drops.length;i++){

const text = chars[Math.floor(Math.random()*chars.length)];

ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){
drops[i]=0;
}

drops[i]++;
}
}

setInterval(drawMatrix,35);

window.addEventListener("resize",()=>{
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
});

/*  VAULT  */

const decryptKey = "221264";

/* ENCRYPT */
function encryptVault(text){

let result = '';

for(let i=0;i<text.length;i++){

let c = text[i].toLowerCase();

if(c === ' '){
result += '  ';
continue;
}

if(map[c] !== undefined){

result += map[c];

if(text[i+1] && map[text[i+1].toLowerCase()]){
result += ' ';
}

}else{
result += c;
}
}

return result;
}

/* DECRYPT */
function decryptVault(binary){

let clean = binary
.replace(/\s*,\s*/g,' , ')
.replace(/\s*\?\s*/g,' ? ')
.replace(/\s*!\s*/g,' ! ')
.replace(/\s*\.\s*/g,' . ')
.trim();

let words = clean.split('  ');
let out = '';

for(let w of words){

let tokens = w.split(' ');

for(let t of tokens){

if(!t) continue;

if([',','?','!','.'].includes(t)){
out = out.trimEnd();
out += t + ' ';
continue;
}

out += inv[t] || t;
}

out += ' ';
}

return out.trim();
}

let encrypted = encryptVault(input.value);

let entries = JSON.parse(localStorage.getItem("vaultEntries") || "[]");

entries.push({
id: crypto.randomUUID(),
titulo: $("vaultTitle").value || "UNTITLED ENTRY",
folder: $("vaultFolder").value,
fecha: new Date().toLocaleString(),
important: false,
data: encrypted
});

localStorage.setItem("vaultEntries", JSON.stringify(entries));

playSound("save");

$("vaultInput").value = "";
$("vaultTitle").value = "";

renderVault();
}

function renderVault(){

let entries = JSON.parse(localStorage.getItem("vaultEntries") || "[]");

let folders = {};

entries.forEach(e=>{

let folder = e.folder || "PERSONAL";

if(!folders[folder]) folders[folder] = [];

folders[folder].push(e);

});

$("vaultOutput").innerHTML = Object.keys(folders).length
? Object.keys(folders).map(folder => `

<div style="
margin:12px 0;
padding:14px;
border:1px solid #9333ea;
cursor:pointer;"
onclick="toggleFolder('${folder}')">

<h3 style="color:#00ff88;margin:0;">
${openedFolder===folder ? '📂' : '📁'} ${folder}
</h3>

</div>

${openedFolder===folder
? folders[folder].map(e => `
<div style="
padding:12px;
margin:8px 0 8px 25px;
border-left:3px solid ${e.important ? '#ffe600' : '#9333ea'};
background:#000;">

<b>${e.important ? '★ ' : ''}${e.titulo}</b><br>
${e.fecha}<br><br>

<button onclick="event.stopPropagation();openVault('${e.id}')">OPEN</button>

<button onclick="event.stopPropagation();editVault('${e.id}')">EDIT</button>

<button onclick="event.stopPropagation();toggleImportant('${e.id}')">
${e.important ? 'UNMARK' : 'IMPORTANT'}
</button>

<button onclick="event.stopPropagation();deleteVault('${e.id}')">
DELETE
</button>

</div>
`).join('')
: ''}

`).join('')
: "NO ENTRIES";
}

function toggleImportant(id){

let entries = JSON.parse(localStorage.getItem("vaultEntries") || "[]");

let entry = entries.find(e => e.id === id);

if(entry){
entry.important = !entry.important;
}

localStorage.setItem("vaultEntries", JSON.stringify(entries));

renderVault();
}

/* OPEN */
function openVault(id){

let entries = JSON.parse(localStorage.getItem("vaultEntries") || "[]");

let entry = entries.find(e => e.id === id);

if(!entry) return;

$("vaultOutput").innerHTML = `
<div style="white-space:pre-wrap;">
<b>${entry.titulo}</b><br><br>

${entry.data}

</div>

<br>
<button onclick="translateVault('${id}')">TRANSLATE</button>
<button onclick="renderVault()">BACK</button>
`;
}
let vaultTimer = null;
function translateVault(id){

let key = prompt("ENTER DECRYPTION KEY");

if(key !== decryptKey){
alert("INVALID KEY");
return;
}

playSound("decrypt");

let entries = JSON.parse(localStorage.getItem("vaultEntries") || "[]");

let entry = entries.find(e => e.id === id);

if(!entry) return;

$("vaultOutput").innerHTML = `
<div style="white-space:pre-wrap;">
<b>${entry.titulo}</b><br><br>
${decryptVault(entry.data)}
</div>

<br>
<button onclick="openVault('${id}')">SHOW BINARY</button>
<button onclick="renderVault()">BACK</button>
`;

clearTimeout(vaultTimer);

vaultTimer = setTimeout(()=>{
openVault(id);
},10000);
}

function editVault(id){

let key = prompt("ENTER DECRYPTION KEY");

if(key !== decryptKey){
playSound("error");
alert("INVALID KEY");
return;
}

playSound("decrypt");

let entries = JSON.parse(localStorage.getItem("vaultEntries") || "[]");

let entry = entries.find(e => e.id === id);

if(!entry) return;

$("vaultOutput").innerHTML = `
<h3>EDIT ENTRY</h3>

<input id="editTitle" value="${entry.titulo}" style="
width:100%;
padding:10px;
margin-bottom:10px;
background:#000;
color:#00ff88;
border:1px solid #9333ea;">

<select id="editFolder" style="
width:100%;
padding:10px;
margin-bottom:10px;
background:#000;
color:#00ff88;
border:1px solid #9333ea;">

<option value="PERSONAL" ${entry.folder==="PERSONAL"?"selected":""}>PERSONAL</option>
<option value="IDEAS" ${entry.folder==="IDEAS"?"selected":""}>IDEAS</option>
<option value="PRIVATE" ${entry.folder==="PRIVATE"?"selected":""}>PRIVATE</option>
<option value="REMINDERS" ${entry.folder==="REMINDERS"?"selected":""}>REMINDERS</option>

</select>

<textarea id="editContent" style="
width:100%;
height:220px;
padding:10px;
background:#000;
color:#00ff88;
border:1px solid #9333ea;">${decryptVault(entry.data)}</textarea>

<br><br>

<button onclick="saveEditedVault('${id}')">
SAVE CHANGES
</button>

<button onclick="renderVault()">CANCEL</button>
`;
}

function saveEditedVault(id){

let entries = JSON.parse(localStorage.getItem("vaultEntries") || "[]");

let entry = entries.find(e => e.id === id);

if(!entry) return;

entry.titulo = $("editTitle").value.trim() || "UNTITLED ENTRY";

entry.folder = $("editFolder").value;

entry.data = encryptVault($("editContent").value);

entry.fecha = new Date().toLocaleString();

localStorage.setItem(
"vaultEntries",
JSON.stringify(entries)
);

playSound("save");

renderVault();
}

/* DELETE */
function deleteVault(id){

let entries = JSON.parse(localStorage.getItem("vaultEntries") || "[]");

entries = entries.filter(e => e.id !== id);

localStorage.setItem("vaultEntries", JSON.stringify(entries));
playSound("delete");
renderVault();
}

renderVault();


document.addEventListener("keydown", function(e){

if(e.ctrlKey && e.key.toLowerCase() === "g"){

e.preventDefault();

toggleCamouflage();
}
});

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}


let lastTap = 0;
let pressTimer;

// DOBLE TAP
document.addEventListener("touchend", function(e){

    const now = new Date().getTime();
    const diff = now - lastTap;

    if(diff < 300 && diff > 0){
        toggleCamouflage();
    }

    lastTap = now;
});

// LONG PRESS
document.addEventListener("touchstart", function(){

    pressTimer = setTimeout(() => {

        const vaultVisible = !$("vault").classList.contains("hidden");

        if(vaultVisible){
            mostrar("traductor");
        }else{
            let key = prompt("ENTER VAULT ACCESS KEY");

            if(key === decryptKey){
                mostrar("vault");
            }else{
                playSound("error");
            }
        }

    }, 1000);

});

document.addEventListener("touchend", function(){
    clearTimeout(pressTimer);
});
</script>

</body>
</html>
